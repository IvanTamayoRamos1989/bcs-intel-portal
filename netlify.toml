[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

[functions.chat]
  included_files = ["netlify/functions/chat_corpus.json", "netlify/functions/ontology_graph.json", "netlify/functions/stakeholders_seed.json", "netlify/functions/foresights.json", "netlify/functions/growth_demand_supply.json", "netlify/functions/strategic_questions.json", "netlify/functions/chat_media.json"]
  external_node_modules = ["@netlify/blobs"]

[functions.chat-memory]
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"

[[edge_functions]]
  function = "auth-gate"
  path = "/*"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/chat-memory"
  to = "/.netlify/functions/chat-memory"
  status = 200

[[redirects]]
  from = "/api/voice-token"
  to = "/.netlify/functions/voice-token"
  status = 200

[[redirects]]
  from = "/api/stakeholders"
  to = "/.netlify/functions/stakeholders-api"
  status = 200

[functions.stakeholders-api]
  included_files = ["netlify/functions/stakeholders_seed.json"]
  external_node_modules = ["@netlify/blobs"]

